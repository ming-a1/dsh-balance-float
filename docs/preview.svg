<svg xmlns="http://www.w3.org/2000/svg" width="360" height="470" viewBox="0 0 360 470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.14"/>
    </filter>
    <clipPath id="cardClip"><rect x="16" y="16" width="328" height="438" rx="6"/></clipPath>
  </defs>

  <!-- page backdrop -->
  <rect width="360" height="470" fill="#eef0f3"/>

  <!-- card -->
  <g filter="url(#shadow)">
    <rect x="16" y="16" width="328" height="438" rx="6" fill="#ffffff" stroke="#e3e6ea"/>
  </g>

  <g clip-path="url(#cardClip)">
    <!-- header -->
    <circle cx="32" cy="41" r="3.5" fill="#d93025"/>
    <text x="44" y="45" font-size="13" font-weight="600" fill="#1f2328">API 余额</text>
    <text x="286" y="45" font-size="12" fill="#6b7280">⟳</text>
    <line x1="16" y1="58" x2="344" y2="58" stroke="#eceef1"/>

    <!-- balance -->
    <text x="30" y="98" font-size="30" font-weight="700" fill="#1f2328">¥37.67</text>
    <rect x="258" y="76" width="68" height="26" rx="4" fill="#f1f3f5" stroke="#d7dbe0"/>
    <text x="292" y="93" font-size="11" font-weight="600" fill="#1f2328" text-anchor="middle">充值 ↗</text>
    <text x="30" y="118" font-size="11" fill="#6b7280">总余额 ¥37.67，已用 ¥3.09</text>

    <!-- today -->
    <text x="30" y="142" font-size="12" fill="#6b7280">今日已用</text>
    <text x="330" y="142" font-size="12" font-weight="600" fill="#1f2328" text-anchor="end">¥3.09</text>
    <text x="30" y="158" font-size="11" fill="#6b7280">17 次调用 · 33.55M tokens</text>
    <text x="30" y="173" font-size="11" fill="#6b7280">峰段 ¥1.71 · 谷段 ¥1.38</text>

    <!-- this turn -->
    <text x="30" y="196" font-size="12" fill="#6b7280">本轮消耗</text>
    <text x="330" y="196" font-size="12" font-weight="600" fill="#1f2328" text-anchor="end">¥0.06</text>
    <text x="30" y="211" font-size="11" fill="#6b7280">10:09 · 1.25M tokens</text>

    <!-- peak badge -->
    <circle cx="34" cy="238" r="3.5" fill="#d93025"/>
    <text x="45" y="242" font-size="12" fill="#1f2328">当前按峰价计费</text>
    <circle cx="146" cy="236" r="7" fill="none" stroke="#c9ced6"/>
    <text x="146" y="240" font-size="9" fill="#6b7280" text-anchor="middle">?</text>
    <rect x="282" y="226" width="46" height="20" rx="4" fill="none" stroke="#d93025"/>
    <text x="305" y="240" font-size="11" fill="#d93025" text-anchor="middle">峰价</text>
    <text x="30" y="262" font-size="12" fill="#4b5563">距切到谷价 1 小时 49 分 36 秒</text>
    <line x1="16" y1="278" x2="344" y2="278" stroke="#eceef1"/>

    <!-- trend -->
    <text x="30" y="302" font-size="12" font-weight="600" fill="#1f2328">用量趋势</text>
    <rect x="196" y="288" width="42" height="20" rx="4" fill="#e9edfb"/>
    <text x="217" y="302" font-size="11" fill="#4d6bfe" text-anchor="middle">今天 ▾</text>
    <text x="252" y="302" font-size="11" fill="#6b7280">近7天</text>
    <text x="284" y="302" font-size="11" fill="#6b7280">近30天</text>
    <text x="320" y="302" font-size="11" fill="#6b7280">本月</text>

    <text x="30" y="324" font-size="15" font-weight="600" fill="#1f2328">¥3.09</text>
    <text x="70" y="324" font-size="11" fill="#6b7280">17 次</text>
    <text x="30" y="340" font-size="11" fill="#d93025">峰段 ¥1.71</text>
    <text x="92" y="340" font-size="11" fill="#6b7280">·</text>
    <text x="102" y="340" font-size="11" fill="#1a7f37">谷段 ¥1.38</text>

    <!-- model bars -->
    <text x="30" y="364" font-size="11" fill="#6b7280">DS Flash</text>
    <rect x="92" y="358" width="176" height="5" rx="2.5" fill="#e6e9ee"/>
    <rect x="92" y="358" width="112" height="5" rx="2.5" fill="#4d6bfe"/>
    <text x="330" y="364" font-size="11" fill="#1f2328" text-anchor="end">¥2.02  65%</text>

    <text x="30" y="384" font-size="11" fill="#6b7280">DS v4.1 Flash</text>
    <rect x="112" y="378" width="156" height="5" rx="2.5" fill="#e6e9ee"/>
    <rect x="112" y="378" width="64" height="5" rx="2.5" fill="#4d6bfe"/>
    <text x="330" y="384" font-size="11" fill="#1f2328" text-anchor="end">¥0.94  30%</text>

    <!-- footer -->
    <line x1="16" y1="404" x2="344" y2="404" stroke="#eceef1"/>
    <rect x="26" y="414" width="76" height="20" rx="4" fill="none" stroke="#c9ced6"/>
    <text x="64" y="428" font-size="11" fill="#6b7280" text-anchor="middle">版本 v1.2.1 ↗</text>
    <text x="330" y="428" font-size="11" fill="#9aa3ad" text-anchor="end">更新于 10:09</text>
  </g>
</svg>
